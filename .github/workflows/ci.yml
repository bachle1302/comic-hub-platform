name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "refactor/**"
      - "fix/**"
  pull_request:
    branches:
      - main

env:
  APP_VERSION: ${{ github.sha }}

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manga_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d manga_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/manga_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test_access_secret
      JWT_REFRESH_SECRET: test_refresh_secret
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      APP_URL: http://localhost:3000
      MAIL_HOST: ""
      MAIL_PORT: 587
      MAIL_USER: ""
      MAIL_PASSWORD: ""
      MAIL_FROM: "Manga Platform <no-reply@test.local>"
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      EMAIL_VERIFY_TOKEN_EXPIRES_MINUTES: 60
      PASSWORD_RESET_TOKEN_EXPIRES_MINUTES: 30
      TOKEN_BUCKET_CAPACITY: 10
      TOKEN_BUCKET_REFILL_RATE: 1
      TOKEN_BUCKET_REFILL_INTERVAL_MS: 1000
      TOKEN_BUCKET_COST: 1
      VIEW_DEDUPE_TTL_SECONDS: 3600
      S3_ENDPOINT: ""
      S3_REGION: auto
      S3_BUCKET: ""
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
      S3_PUBLIC_URL: ""
      S3_FORCE_PATH_STYLE: "true"
      S3_SIGNED_READ_EXPIRES_SECONDS: 300
      S3_PRIVATE_BUCKET_MODE: "false"
      PAYOS_CLIENT_ID: ""
      PAYOS_API_KEY: ""
      PAYOS_CHECKSUM_KEY: ""
      PAYMENT_RETURN_URL: http://localhost:3000/me/wallet?payment=success
      PAYMENT_CANCEL_URL: http://localhost:3000/me/wallet?payment=cancel
      PAYMENT_WEBHOOK_URL: http://localhost:4000/payments/payos/webhook
      APP_VERSION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: comic-hub-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: comic-hub-backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: comic-hub-backend
        run: npx prisma generate

      - name: Apply database migrations
        working-directory: comic-hub-backend
        run: npx prisma migrate deploy

      - name: Lint backend
        working-directory: comic-hub-backend
        run: npm run lint

      - name: Build backend
        working-directory: comic-hub-backend
        run: npm run build

      - name: Test backend
        working-directory: comic-hub-backend
        run: npm test

      - name: Check backend has no any
        working-directory: comic-hub-backend
        run: "! grep -R -n -E '\\bany\\b' src prisma"

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: test-google-client-id
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: test
      NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install frontend dependencies
        working-directory: fe
        run: npm ci

      - name: Lint frontend
        working-directory: fe
        run: npm run lint

      - name: Build frontend
        working-directory: fe
        run: npm run build

      - name: Check frontend has no any
        working-directory: fe
        run: "! grep -R -n -E '\\bany\\b' src"

      - name: Check frontend has no legacy token storage
        working-directory: fe
        run: "! grep -R -n -E 'localStorage|getRefreshToken|setTokens|clearTokens' src"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: >-
          docker build
          --build-arg APP_VERSION=${{ github.sha }}
          -t comic-backend-ci:${{ github.sha }} ./comic-hub-backend

      - name: Build frontend image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000
          --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000
          --build-arg NEXT_PUBLIC_GOOGLE_CLIENT_ID=test-google-client-id
          --build-arg NEXT_PUBLIC_SENTRY_DSN=
          --build-arg NEXT_PUBLIC_SENTRY_ENVIRONMENT=test
          --build-arg NEXT_PUBLIC_APP_VERSION=${{ github.sha }}
          -t comic-frontend-ci:${{ github.sha }} ./fe
