version: '3.8'

services:
  postgres:
    image: postgres:15-alpine   # Sửa từ 16 thành 15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abc130204
      POSTGRES_DB: manga_db
    ports:
      - '5432:5432'
    volumes:
      - manga_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine      # Dùng bản alpine
    restart: always
    ports:
      - '6379:6379'

  minio:
    image: quay.io/minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # Port cho API
      - '9001:9001' # Port cho giao diện Web Console
    volumes:
      - manga_minio_data:/data

volumes:
  manga_postgres_data:
  manga_minio_data: