services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_DB: manga_db
    volumes:
      - manga_postgres_data:/var/lib/postgresql/data
    networks:
      - manga_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - manga_network

  backend:
    image: manga-backend:${APP_VERSION:-local}
    build:
      context: ./comic-hub-backend
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
    restart: unless-stopped
    env_file:
      - path: ./comic-hub-backend/.env.production
        required: false
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
    networks:
      - manga_network

  frontend:
    image: manga-frontend:${APP_VERSION:-local}
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_SERVER_API_URL: ${NEXT_SERVER_API_URL:-http://backend:4000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-local}
    environment:
      NEXT_SERVER_API_URL: ${NEXT_SERVER_API_URL:-http://backend:4000}
    restart: unless-stopped
    env_file:
      - path: ./fe/.env.production
        required: false
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - manga_network

volumes:
  manga_postgres_data:

networks:
  manga_network:
    driver: bridge
